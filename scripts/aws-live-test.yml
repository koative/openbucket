AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  OpenBucket live S3 test - one private, versioned bucket and an IAM user that can reach only that bucket.
  Create the user's access key with the CLI afterwards so the secret never lands in stack outputs.

Resources:
  TestBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # The tests delete what they write; this removes leftovers from interrupted runs.
      LifecycleConfiguration:
        Rules:
          - Id: expire-test-leftovers
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  TestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TestBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TestBucket.Arn
              - !Sub "${TestBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  TestUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: openbucket-live-test-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource: !GetAtt TestBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:PutObjectTagging
                  - s3:DeleteObjectTagging
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub "${TestBucket.Arn}/*"

Outputs:
  BucketName:
    Value: !Ref TestBucket
  UserName:
    Value: !Ref TestUser
