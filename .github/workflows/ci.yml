name: CI

on:
  push:
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift format
        run: swift format lint --strict --recursive App AppTests Packages/Bucketdeck/Sources Packages/Bucketdeck/Tests
      - name: Project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          git diff --exit-code -- Bucketdeck.xcodeproj
      - name: Package tests
        run: swift test --package-path Packages/Bucketdeck
      - name: Build and test
        run: >-
          xcodebuild test
          -project Bucketdeck.xcodeproj
          -scheme Bucketdeck
          -destination 'platform=macOS'
          -derivedDataPath DerivedData
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          -quiet
