name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift format
        run: swift format lint --strict --recursive App AppTests Packages/OpenBucket/Sources Packages/OpenBucket/Tests
      - name: Project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          git diff --exit-code -- OpenBucket.xcodeproj
      - name: Package tests
        run: swift test --package-path Packages/OpenBucket
      - name: Build and test
        run: >-
          xcodebuild test
          -project OpenBucket.xcodeproj
          -scheme OpenBucket
          -destination 'platform=macOS'
          -derivedDataPath DerivedData
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          -quiet
