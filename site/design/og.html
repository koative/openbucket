<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Bucketdeck share card</title>
<!-- Source of site/public/og.png, in the layout of the OpenMacApps social card. Serve the repository root over
     HTTP, open this file in a browser and capture exactly 1200 × 630. Inter (SIL OFL) stands in for SF Pro,
     whose license doesn't cover marketing images. The shelf names only services with a live test result in
     docs/compatibility.md; no third-party logos. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,600;14..32,700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f5f5f7;color:#1d1d1f;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body{padding:64px 76px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;gap:16px;align-items:center;font-size:34px;font-weight:700;letter-spacing:-.8px}
.brand img{width:64px;height:64px;margin:-6px}
h1{margin:0;font-size:62px;font-weight:700;line-height:1.08;letter-spacing:-2px}
h1 span{color:#6e6e73}
.shelf{display:flex;gap:12px;align-items:center}
.chip{padding:10px 20px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08);font-size:21px;font-weight:600;color:#1d1d1f;letter-spacing:-.3px}
.get{margin-left:auto;padding:12px 30px;border-radius:999px;background:#0071e3;color:#fff;font-size:24px;font-weight:700;letter-spacing:-.3px}
</style>
<div class="brand"><img src="../../brand/app-icon/bucketdeck-128.png" alt="">Bucketdeck</div>
<h1>The S3 browser for your Mac.<br><span>Read-only until you allow changes.</span></h1>
<div class="shelf">
  <span class="chip">Amazon S3</span>
  <span class="chip">Cloudflare R2</span>
  <span class="chip">MinIO</span>
  <span class="chip">Garage</span>
  <span class="chip">RustFS</span>
  <span class="get">Download</span>
</div>
</html>
