<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>OpenBucket share card</title>
<!-- Source of site/public/og.png. Serve the repository root over HTTP, open this file in a browser on macOS
     (so system-ui is SF Pro) and capture exactly 1200 × 630. The window is the real grid screenshot. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;color:#1d1d1f;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-columns:470px 1fr;align-items:center;gap:40px;padding:0 0 0 72px}
.copy{display:grid;gap:22px}
.icon{width:96px;height:96px;border-radius:22.5%;filter:drop-shadow(0 10px 18px rgb(0 40 120 / .28))}
h1{margin:0;font-size:60px;line-height:1.04;font-weight:600;letter-spacing:-1.6px}
p{margin:0;color:#6e6e73;font-size:24px;line-height:1.3}
.shot{justify-self:start;width:820px;border-radius:12px / 12px;box-shadow:0 2px 6px rgb(0 0 0 / .12),0 30px 60px -16px rgb(0 0 0 / .4)}
</style>
<div class="copy">
  <img class="icon" src="../../App/Resources/Assets.xcassets/AppIcon.appiconset/icon-256.png" alt="">
  <h1>Your S3 buckets, right on your Mac.</h1>
  <p>Free and open source for macOS.</p>
</div>
<img class="shot" src="../../docs/media/browser-grid.jpg" alt="">
</html>
