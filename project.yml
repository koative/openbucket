name: OpenBucket
options:
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  OpenBucketPackage:
    path: Packages/OpenBucket
targets:
  OpenBucket:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: OpenBucketPackage
        product: OpenBucketCore
      - package: OpenBucketPackage
        product: OpenBucketS3
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.openbucket.s3-location
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [s3]
        # Items dragged inside the app carry this type, so drops move them instead of downloading.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.openbucket.item
            UTTypeDescription: OpenBucket item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbucket.app
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 3
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenBucket
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  OpenBucketTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: OpenBucket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbucket.app-tests
